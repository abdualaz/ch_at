name: Unzip chat.zip

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure chat.zip exists (download fallback)
        run: |
          if [ ! -f chat.zip ]; then
            echo "chat.zip not found in repo root, downloading from main branch..."
            curl -L -o chat.zip https://github.com/abdualaz/ch_at/raw/main/chat.zip
          fi
          unzip -l chat.zip

      - name: Unzip archive
        run: |
          mkdir -p chat_extracted
          unzip -o chat.zip -d chat_extracted

      - name: Commit extracted files (optional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat_extracted || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unzip chat.zip via workflow"
            git push
          fi
